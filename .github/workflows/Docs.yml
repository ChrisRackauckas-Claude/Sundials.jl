name: Documentation

on:
  pull_request:
    branches:
      - master
    paths:
      - "src/**"
      - "docs/**"
      - "Project.toml"
      - "Manifest.toml"
      - ".github/workflows/Docs.yml"
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "docs/**"
      - "Project.toml"
      - "Manifest.toml"
      - ".github/workflows/Docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.10"
      - uses: julia-actions/cache@v3
      - name: Instantiate documentation environment
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(path=".")
            Pkg.instantiate()'
      - name: Build documentation
        run: julia --project=docs docs/make.jl
